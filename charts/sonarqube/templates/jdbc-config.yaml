{{- if or .Values.jdbcOverwrite.enabled .Values.jdbcOverwrite.enable }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "sonarqube.fullname" . }}-jdbc-config
  labels: {{- include "sonarqube.labels" . | nindent 4 }}
data:
  SONAR_JDBC_USERNAME: {{ template "jdbc.username" . }}
  SONAR_JDBC_URL: {{ .Values.jdbcOverwrite.jdbcUrl | trim | quote }}
  SONAR_JDBC_AZURE_IDENTITY: {{ .Values.jdbcOverwrite.AzureIdentity  | quote }}
  SONAR_JDBC_AWS_IDENTITY: {{ .Values.jdbcOverwrite.AwsIdentity  | quote }}
  SONAR_JDBC_AWS_REGION: {{ .Values.jdbcOverwrite.AwsRegion  | quote }}
  SONAR_JDBC_AWS_HOSTNAME: {{ .Values.jdbcOverwrite.AwsHostname  | quote }}
  SONAR_JDBC_AWS_PORT:  {{ .Values.jdbcOverwrite.AwsPort  | quote }}
{{- end }}
